name: SDXI driver CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, m68k, x86_64]
        cc: [gcc, clang]
        exclude:
          - arch: m68k
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - name: Create build environment image
        run: |
          ci-tools/setup buildenv
      - name: Check
        run: |
          ci-tools/check buildenv ${{ matrix.arch }} ${{ matrix.cc }}
